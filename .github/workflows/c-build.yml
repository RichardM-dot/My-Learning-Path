name: C项目自动编译测试
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: 安装GCC编译器
      run: sudo apt-get update && sudo apt-get install -y gcc
    - name: 编译C程序
      run: |
        cd "The C Programming Language"
        gcc -o student_management "学生成绩管理系统.c"
    - name: 检查文件是否存在
      run: ls -la "The C Programming Language/student_management"